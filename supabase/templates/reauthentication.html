<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Your verification code</title></head>
<body style="margin:0; padding:0; background-color:#0d1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#0d1117; padding:40px 0;">
    <tr><td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#171c22; border-radius:16px; overflow:hidden; border:1px solid rgba(255,255,255,0.08);">
        <tr><td style="padding:32px 40px 0 40px;" align="center">
          <span style="font-size:22px; font-weight:800; letter-spacing:4px; color:#f5f7f8; text-transform:uppercase; font-family:'Courier New', monospace;">HANBEE</span>
        </td></tr>
        <tr><td style="padding:24px 40px 0 40px;"><div style="height:1px; background:linear-gradient(90deg, transparent, rgba(56,189,241,0.4), transparent);"></div></td></tr>
        <tr><td style="padding:32px 40px 8px 40px;">
          <h1 style="margin:0 0 12px 0; font-size:20px; line-height:1.3; color:#f5f7f8; font-weight:700;">Confirm it's you</h1>
          <p style="margin:0 0 20px 0; font-size:14px; line-height:1.6; color:#9aa5b1;">
            You're performing a sensitive action on your Hanbee account. Enter this code to confirm it's you. It expires in 10 minutes.
          </p>
        </td></tr>
        <tr><td style="padding:0 40px 32px 40px;" align="center">
          <div style="display:inline-block; padding:16px 32px; background-color:#0d1117; border:1px solid rgba(56,189,241,0.4); border-radius:10px; font-size:28px; font-weight:800; letter-spacing:8px; color:#38bdf1; font-family:'Courier New', monospace;">
            {{ .Token }}
          </div>
        </td></tr>
        <tr><td style="padding:20px 40px; background-color:#11151a; border-top:1px solid rgba(255,255,255,0.06);">
          <p style="margin:0; font-size:11px; line-height:1.6; color:#5c6670; text-align:center;">
            Sent by Hanbee &middot; Access your race and learning workspace<br />
            Didn't request this code? Secure your account by resetting your password.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
